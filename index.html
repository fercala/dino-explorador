<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>@font-face{font-family:"Baloo 2";font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/baloo2-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}@font-face{font-family:"Baloo 2";font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/baloo2-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}</style>

<style>
:root{--bg:#bfe6f5;--ink:#4a2f17;--card:#fffaf0;--accent:#ff9f43;--accent2:#4caf50;--muted:#8a6d4b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#bfe6f5;--ink:#4a2f17;--card:#fffaf0}}
:root[data-theme="dark"]{--bg:#bfe6f5;--ink:#4a2f17;--card:#fffaf0}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
canvas.nocur{cursor:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(40,90,120,.25)}
.hidden{display:none}
.card{background:var(--card);border:6px solid #e8c58f;border-radius:32px;padding:28px 32px;max-width:560px;width:100%;box-sizing:border-box;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.12)}
h1{margin:0 0 8px;font-size:clamp(30px,6vw,52px);line-height:1;font-weight:800;color:#e0702a}
h1 span{display:block;font-size:.7em;color:#3f7a35}
h2{margin:0 0 12px;font-size:30px}
label{display:block;font-size:20px;margin:14px 0 6px;font-weight:600}
input[type=text]{font:inherit;font-size:30px;text-align:center;width:100%;box-sizing:border-box;padding:8px 14px;border-radius:18px;border:4px solid #e8c58f;background:#fff;color:var(--ink);outline:none}
input[type=text]:focus{border-color:var(--accent)}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:20px;padding:10px 18px;font-size:20px;background:#ffe2b8;color:var(--ink);margin:4px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
button.big{font-size:36px;background:var(--accent2);color:#fff;padding:12px 40px;margin-top:18px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:10px 0}
.row label{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 14px;font-size:22px}
.row input[type=checkbox]{width:26px;height:26px}
.num{font:inherit;font-size:20px;width:64px;padding:4px 8px;border-radius:12px;border:3px solid #e8c58f}
select{font:inherit;font-size:20px;padding:4px 8px;border-radius:12px;border:3px solid #e8c58f;background:#fff}
.card{max-height:94vh;overflow-y:auto}
.tip{font-size:15px;color:var(--muted);margin:16px 0 0}
@media (max-height:560px){.ov{padding:8px}.card{padding:12px 20px;border-width:4px;max-width:640px}#start h1{font-size:34px}#start h1 span{display:inline;margin-left:.3em}#start label{margin:6px 0 4px;font-size:18px}#start input[type=text]{font-size:24px;padding:4px 12px}#start button.big{font-size:28px;padding:8px 32px;margin-top:10px}#start .row{margin:6px 0}#start .tip{margin:8px 0 0;font-size:13px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start" class="ov">
  <div class="card">
    <h1>El pequeño explorador<span>de dinosaurios</span></h1>
    <label for="nm">¿Cómo se llama el explorador?</label>
    <input id="nm" type="text" maxlength="14" placeholder="Escribe su nombre" autocomplete="off">
    <button id="play" class="big">▶ ¡A jugar!</button>
    <div class="row"><button id="fs">Pantalla completa</button><span id="inst" hidden><button id="bInst">📲 Instalar en el móvil</button></span></div>
    <p id="iosHelp" hidden style="margin:4px 0;font-size:16px;line-height:1.3"></p>
    <p class="tip">Para los mayores: durante el juego, mantén pulsado el engranaje ⚙ de la esquina para abrir el menú.</p>
  </div>
</div>

<div id="adult" class="ov hidden">
  <div class="card">
    <h2>Menú de mayores</h2>
    <label for="nm2">Nombre del explorador</label>
    <input id="nm2" type="text" maxlength="14" autocomplete="off">
    <div class="row">
      <button data-a="map">Mapa</button><button data-a="world">Gran Isla</button><button data-a="beach">Playa</button><button data-a="bosque">Bosque</button><button data-a="nidos">Nidos</button><button data-a="quarry">Cantera</button><button data-a="desierto">Desierto</button><button data-a="museo">Museo</button><button data-a="colorear">Pintar</button><button data-a="juegos">Juegos</button><button data-a="mascota">Mi dino</button><button data-a="baile">Fiesta</button><button data-a="helada">Isla helada</button><button data-a="buceo">Buceo</button><button data-a="cuentos">Cuentos</button><button data-a="trofeos">Trofeos</button><button data-a="ropero">Ropero</button><button data-a="album">Álbum</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="mus"> Música</label>
      <label><input type="checkbox" id="voi"> Voz</label>
      <label><input type="checkbox" id="big"> Modo grande</label>
      <label><input type="checkbox" id="en"> Palabras en inglés</label>
    </div>
    <div class="row">
      <label>Cumpleaños: día <input type="number" id="bd" min="0" max="31" class="num"> mes <input type="number" id="bm" min="0" max="12" class="num"></label>
      <label>Fiesta <select id="fest"><option value="auto">Según la fecha</option><option value="none">Ninguna</option><option value="cumple">Cumpleaños</option><option value="navidad">Navidad</option><option value="halloween">Halloween</option></select></label>
    </div>
    <div class="row">
      <label for="ease">Ayuda <input type="range" id="ease" min="0" max="100" step="5"></label>
    </div>
    <div class="row"><button data-a="fs">Pantalla completa</button><button data-a="reset" id="resetBtn">Borrar progreso</button></div>
    <button data-a="close" class="big">Seguir jugando</button>
  </div>
</div>

<script>
'use strict';
// ---------- básico ----------
const W = 1600, H = 900;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, ox = 0, oy = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * DPR); cv.height = Math.round(innerHeight * DPR);
  scale = Math.min(innerWidth / W, innerHeight / H);
  ox = (innerWidth - W * scale) / 2; oy = (innerHeight - H * scale) / 2;
}
addEventListener('resize', resize); resize();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const store = {
  get(k, d) { try { const v = localStorage.getItem('dino_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dino_' + k, JSON.stringify(v)); } catch (e) {} }
};
const S = {
  name: store.get('name', ''), album: store.get('album', []), done: store.get('done', {}),
  music: store.get('music', true), voice: store.get('voice', true)
};
S.outfit = store.get('outfit', { hat: 'safari', shirt: '#e9c46a' }); S.ease = store.get('ease', 0.5); S.big = store.get('big', false); S.seen = store.get('seen', 0); S.pet = store.get('pet', { sp: null, xp: 0 }); S.gifts = store.get('gifts', []); S.tseen = store.get('tseen', 0); S.fest = store.get('fest', 'auto'); S.bday = store.get('bday', { d: 0, m: 0 }); S.en = store.get('en', false);
function save() { for (const k of ['name', 'album', 'done', 'music', 'voice', 'outfit', 'ease', 'big', 'seen', 'pet', 'gifts', 'tseen', 'fest', 'bday', 'en']) store.set(k, S[k]); }
const kidName = () => S.name || 'explorador';

// ---------- sonido ----------
let AC = null, master = null, musNext = 0, musI = 0;
function ac() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, type = 'sine', vol = 0.2, when = 0, f2 = null) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function noise(dur, vol = 0.2, ftype = 'lowpass', ff = 800, when = 0) {
  const a = ac(); if (!a) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = a.currentTime + when, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.value = ff;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
const SFX = {
  tap() { tone(520, 0.12, 'sine', 0.12, 0, 780); },
  pop() { tone(380, 0.18, 'sine', 0.25, 0, 1000); tone(1200, 0.1, 'triangle', 0.08, 0.08); },
  giggle() { [0, 1, 2, 3, 4].forEach(i => tone(i % 2 ? 900 : 1150, 0.08, 'triangle', 0.09, i * 0.075)); },
  step() { noise(0.06, 0.05, 'lowpass', 700); },
  chof() { noise(0.22, 0.35, 'lowpass', 650); tone(140, 0.18, 'sine', 0.25, 0, 70); },
  splash() { noise(0.5, 0.25, 'highpass', 1400); noise(0.3, 0.15, 'bandpass', 600, 0.05); },
  clack() { tone(1500, 0.04, 'square', 0.06); tone(1300, 0.04, 'square', 0.06, 0.12); tone(1500, 0.04, 'square', 0.06, 0.24); },
  roar() { tone(330, 0.45, 'sawtooth', 0.07, 0, 170); tone(660, 0.35, 'triangle', 0.06, 0.02, 300); },
  sparkle() { [0, 1, 2, 3].forEach(i => tone(1600 + i * 300, 0.15, 'sine', 0.06, i * 0.06)); },
  win() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.16, i * 0.12)); },
  boing() { tone(200, 0.3, 'sine', 0.2, 0, 90); },
  nom() { tone(260, 0.08, 'square', 0.07); tone(200, 0.08, 'square', 0.07, 0.14); },
  crack() { tone(1800, 0.05, 'square', 0.05); noise(0.08, 0.2, 'highpass', 2000); tone(500, 0.1, 'triangle', 0.1, 0.02); },
  rumble() { noise(1.2, 0.4, 'lowpass', 220); tone(70, 1.0, 'sine', 0.3, 0, 40); },
  brush() { noise(0.09, 0.07, 'highpass', 2600); },
  flutter() { [0, 1, 2, 3, 4, 5].forEach(i => tone(2000 + Math.random() * 400, 0.04, 'sine', 0.04, i * 0.05)); }
};
const MEL = [0, 4, 7, 9, 7, 4, 2, 4, 0, 2, 4, 7, 9, 7, 4, 2];
function musicTick() {
  if (scene === 'baile' && baile.party > 0) { if (AC) musNext = AC.currentTime + 0.2; return; }
  if (!S.music || !AC || AC.state !== 'running') { if (AC) musNext = AC.currentTime + 0.2; return; }
  while (musNext < AC.currentTime + 0.3) {
    if (musNext < AC.currentTime) musNext = AC.currentTime + 0.05;
    const n = MEL[musI % MEL.length], f = 523.25 * Math.pow(2, n / 12);
    const when = musNext - AC.currentTime;
    tone(f, 0.38, 'sine', 0.035, when); tone(f * 2, 0.2, 'triangle', 0.01, when);
    if (musI % 4 === 0) tone(130.8 * Math.pow(2, [0, 5, 7, 5][(musI / 4 | 0) % 4] / 12), 0.9, 'sine', 0.05, when);
    musI++; musNext += 0.44;
  }
}
// voz
let voiceES = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voiceES = vs.find(v => /^es[-_]ES/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t, pitch = 1.25) { sayES(t, pitch); sayEN(t); }
function sayES(t, pitch = 1.25) {
  if (!S.voice || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES';
    if (voiceES) u.voice = voiceES; u.rate = 0.92; u.pitch = pitch; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- especies ----------
const SPECIES = {
  tri: { id: 'tri', name: 'Triceratops', col: '#86c96b', dk: '#3f7a35', bl: '#e3f5c5', acc: '#f6a04d' },
  ste: { id: 'ste', name: 'Estegosaurio', col: '#f4b45c', dk: '#9a5a1a', bl: '#fde9c3', acc: '#e65f5c' },
  bra: { id: 'bra', name: 'Braquiosaurio', col: '#6ab8e6', dk: '#2b6c96', bl: '#d6efff', acc: '#2b6c96' },
  rex: { id: 'rex', name: 'Tiranosaurio', col: '#ef7f72', dk: '#9b3a30', bl: '#ffd9cf', acc: '#fff' },
  ptr: { id: 'ptr', name: 'Pterodáctilo', col: '#b993e8', dk: '#5e3d93', bl: '#eadcff', acc: '#ffc23d' },
  ank: { id: 'ank', name: 'Anquilosaurio', col: '#e6c94e', dk: '#8a6d10', bl: '#fff3c0', acc: '#b07d2a' },
  par: { id: 'par', name: 'Parasaurolofus', col: '#5ccfb0', dk: '#21806a', bl: '#d4f7ec', acc: '#ff8a5c' },
  spi: { id: 'spi', name: 'Espinosaurio', col: '#5b8def', dk: '#284f9e', bl: '#d7e5ff', acc: '#ffb347' }
};
const ALL_SP = ['tri', 'ste', 'bra', 'rex', 'ptr', 'ank', 'par', 'spi'];
function pickSpecies(pool, n) {
  const fresh = shuffle(pool.filter(id => !S.album.includes(id))), old = shuffle(pool.filter(id => S.album.includes(id)));
  return fresh.concat(old).slice(0, n);
}
function addAlbum(id) { if (!S.album.includes(id)) { S.album.push(id); save(); } }

// ---------- dibujo: utilidades ----------
let c = ctx;
function shape(fill, stroke, lw, fn) { c.beginPath(); fn(); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = lw || 4; c.strokeStyle = stroke; c.stroke(); } }
function ell(x, y, rx, ry, r = 0) { c.moveTo(x + rx * Math.cos(r), y + rx * Math.sin(r)); c.ellipse(x, y, rx, ry, r, 0, Math.PI * 2); }
function circ(x, y, r) { c.moveTo(x + r, y); c.arc(x, y, r, 0, Math.PI * 2); }
function rr(x, y, w, h, r) { c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
function txt(s, x, y, size, col = '#4a2f17', outline = '#fff', align = 'center') {
  c.font = `800 ${size}px "Baloo 2", system-ui, sans-serif`; c.textAlign = align; c.textBaseline = 'middle';
  if (outline) { c.lineJoin = 'round'; c.lineWidth = size / 5; c.strokeStyle = outline; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}
let SLEEP = false;
function eye(x, y, r = 8) {
  if (SLEEP) { c.beginPath(); c.arc(x, y - r * 0.2, r * 0.8, 0.15 * Math.PI, 0.85 * Math.PI); c.lineWidth = 3; c.strokeStyle = '#2b1b0e'; c.lineCap = 'round'; c.stroke(); return; }
  shape('#fff', '#2b1b0e', 2.5, () => circ(x, y, r));
  shape('#2b1b0e', null, 0, () => circ(x + r * 0.2, y + r * 0.05, r * 0.55));
  shape('#fff', null, 0, () => circ(x + r * 0.4, y - r * 0.25, r * 0.22));
}
function smile(x, y, r, col) { c.beginPath(); c.arc(x, y, r, 0.15 * Math.PI, 0.85 * Math.PI); c.lineWidth = 3; c.strokeStyle = col; c.lineCap = 'round'; c.stroke(); }
function cheek(x, y) { c.globalAlpha = 0.45; shape('#ff8fa3', null, 0, () => circ(x, y, 6)); c.globalAlpha = 1; }

// ---------- dinosaurios ----------
function drawDino(sp, x, y, s, t, face = 1, moving = false, shadow = true) {
  c.save(); c.translate(x, y);
  if (shadow) { c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); ell(0, 0, 58 * s, 12 * s); c.fill(); }
  c.scale(s * face, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const lg = moving ? Math.sin(t * 14) * 6 : 0, wag = Math.sin(t * 4) * 5;
  const { col, dk, bl, acc } = sp;
  if (sp.id === 'mam' || sp.id === 'ple') { drawExtra(sp, t, lg, wag); c.restore(); return; }
  if (sp.id === 'ptr') {
    const f = Math.sin(t * 7);
    c.translate(0, -25 + Math.sin(t * 3) * 6);
    shape(dk, dk, 3, () => { c.moveTo(-5, -55); c.lineTo(-60, -95 - f * 30); c.lineTo(-15, -45); c.closePath(); });
    shape(col, dk, 3, () => { c.moveTo(-15, -42); c.lineTo(-25, -25); c.moveTo(0, -42); c.lineTo(-5, -25); });
    shape(col, dk, 4, () => ell(0, -55, 26, 17));
    shape(bl, null, 0, () => ell(4, -49, 15, 8));
    shape(col, dk, 4, () => { c.moveTo(10, -60); c.lineTo(-55, -100 + f * 35); c.lineTo(-5, -48); c.closePath(); });
    shape(acc, dk, 3, () => { c.moveTo(30, -80); c.lineTo(72, -72); c.lineTo(30, -64); c.closePath(); });
    shape(col, dk, 4, () => ell(25, -74, 17, 13));
    shape(acc, dk, 3, () => { c.moveTo(14, -82); c.lineTo(-5, -100); c.lineTo(22, -86); c.closePath(); });
    eye(29, -78, 6); cheek(22, -68);
  } else if (sp.id === 'rex' || sp.id === 'spi') {
    shape(dk, dk, 3, () => rr(-12 + lg, -36, 18, 36, 7));
    if (sp.id === 'spi') {
      shape(acc, dk, 4, () => { c.moveTo(-34, -78); c.quadraticCurveTo(-20, -150, 6, -142); c.quadraticCurveTo(30, -130, 26, -84); c.closePath(); });
      shape(null, dk, 2, () => { for (let i = 0; i < 4; i++) { c.moveTo(-22 + i * 13, -82); c.lineTo(-20 + i * 11, -128 + Math.abs(i - 1.5) * 6); } });
    }
    shape(col, dk, 4, () => { c.moveTo(-20, -75); c.quadraticCurveTo(-70, -78, -100, -45 + wag); c.quadraticCurveTo(-60, -48, -18, -45); c.closePath(); });
    shape(col, dk, 4, () => ell(0, -62, 38, 32, -0.25));
    shape(bl, null, 0, () => ell(12, -52, 22, 19, -0.25));
    shape(col, dk, 4, () => rr(-12 - lg, -40, 20, 40, 8));
    shape(col, dk, 4, () => { c.moveTo(26, -66); c.lineTo(40, -58); });
    c.lineWidth = 7; c.strokeStyle = col; c.beginPath(); c.moveTo(27, -66); c.lineTo(38, -59); c.stroke();
    shape(col, dk, 4, () => rr(10, -128, 66, 46, 22));
    shape(bl, null, 0, () => rr(28, -100, 44, 12, 6));
    eye(46, -112, 9); cheek(36, -96);
    smile(56, -100, 9, dk);
  } else {
    // cuadrúpedos

const FOSSIL = { col: '#f6eedc', dk: '#a88b62', bl: '#e9dcc0', acc: '#e9dcc0' };

  },

function petStage() { if (!S.pet.sp) return 0; return S.pet.xp < PET_T[1] ? 1 : S.pet.xp < PET_T[2] ? 2 : 3; }

}

}

const baile = {

    ids.forEach(id => put(SPECIES[id], false)); if (pet) put(SPECIES[S.pet.sp], true);

  },
  dAt(x, y) { return this.ds.slice().reverse().find(d => dinoHit(x, y, d.x, d.y, d.s * (d.pet ? PET_S[petStage()] : 1))); },

    if (BACK(x, y)) { SFX.tap(); goHome(); return; }
    if (this.ballHit(x, y)) { this.ds.forEach(d => this.start(d, 10)); this.lights++; SFX.sparkle(); confetti(); say('¡Todos a bailar!'); this.check(); return; }
    if (this.drumHit(x, y)) { this.drum = 0.25; tone(110, 0.35, 'sine', 0.4, 0, 45); noise(0.12, 0.3, 'lowpass', 400); this.ds.forEach(d => d.hop = 0.4); return; }

const SCENES = { trofeos, helada, buceo, cuentos, mascota, baile, beach, quarry, map, album, bosque, nidos, desierto, museo, world, colorear, ropero, juegos, start: startScn };

{ const bd = beach.draw, bc = beach.click, bcur = beach.cursor;

});

// ayuda automática: si falla, el objetivo "atrae" los clics cercanos y la ayuda llega antes

  const R = scn.world ? h.r + 30 * S.ease + (S.big ? 80 : 0) : 60 + 130 * S.ease + (S.big ? 120 : 0) + (h.r || 0);

}
let missStreak = 0, fastStreak = 0;
function adapt(hit, gap) {
  if (!hit) { missStreak++; fastStreak = 0; if (missStreak >= 3) { S.ease = Math.min(1, S.ease + 0.2); missStreak = 0; save(); } }
  else { missStreak = 0; if (gap < 3) { if (++fastStreak >= 4) { S.ease = Math.max(0, S.ease - 0.2); fastStreak = 0; save(); } } else fastStreak = 0; }
}
